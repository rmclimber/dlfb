name: Foundation and DNA
on: [push, pull_request]
jobs:
  dna:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.26
      - run: uv sync --extra dna --locked --python ${{ matrix.python }}
      - run: uv pip check
      - run: uv run --extra dna --locked pytest -q
      - run: >-
          uv run --extra dna --locked ruff check
          src/dlfb/data.py src/dlfb/dna/dataset.py src/dlfb/dna/train.py
          src/dlfb/utils/restore.py scripts tests
